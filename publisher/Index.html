<!doctype html>
<html lang="en"><head><base target="_top"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--teal:#044f56;--gold:#ffae05;--pale:#f2f7f5;--muted:#536967}
*{box-sizing:border-box}
body{font:400 14px/1.55 Montserrat,Arial,sans-serif;margin:0;background:#fff;color:#253738;padding:18px}
h2{font-size:1.24rem;letter-spacing:-.02em;color:var(--teal);margin:0 0 7px}
p{margin:0 0 16px;color:var(--muted)}
label{display:block;font-weight:800;margin:14px 0 6px;font-size:.82rem;color:#204548}
input,textarea,select{width:100%;font:500 15px/1.5 Montserrat,Arial,sans-serif;border:1px solid #b5ceca;border-radius:11px;padding:12px 13px;color:#203739;background:#fff}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #7bc2c8;outline-offset:1px}
textarea{min-height:165px;resize:vertical}
button{width:100%;margin-top:16px;background:var(--teal);color:#fff;border:0;border-radius:11px;padding:14px;font:800 14px Montserrat,Arial,sans-serif;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.muted{font-size:.75rem;color:var(--muted);margin:8px 0 0}
.notice{font-size:.78rem;background:#fff8ea;border-left:4px solid var(--gold);padding:12px 13px;border-radius:9px;margin:16px 0 0}
#status{font-size:.84rem;font-weight:700;margin-top:15px;min-height:24px}
#status[data-kind="success"]{color:#287052}
#status[data-kind="error"]{color:#922f30}
#status a{color:var(--teal);text-decoration:underline}
</style></head>
<body>
<h2>Post a trip update</h2>
<p>A quick announcement for everyone traveling with us.</p>
<form id="publish-form">
<label for="organizer">Posting as</label>
<select id="organizer" required>
<option value="ashlee">Ashlee</option>
<option value="rob">Rob</option>
</select>
<label for="title">Update title</label>
<input id="title" maxlength="110" required placeholder="e.g., Tomorrow's departure">
<label for="message">Message</label>
<textarea id="message" maxlength="3000" required placeholder="Type the update for travelers here…"></textarea>
<label for="pin">Your four-digit PIN</label>
<input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="off" required placeholder="••••">
<p class="muted">Only organizers with a PIN can publish. Updates are visible to everyone.</p>
<button id="publish" type="submit">Publish update</button>
</form>
<p id="status" aria-live="polite" role="status"></p>
<div class="notice">New updates appear when the guide finishes publishing. Travelers can use the Refresh button to see the latest announcement.</div>
<script>
(() => {
 "use strict";
 const $=id=>document.getElementById(id);
 const setStatus=(message,kind)=>{
   const el=$("status");el.textContent=message;el.dataset.kind=kind||"";
 };
 $("publish-form").addEventListener("submit",event=>{
   event.preventDefault();
   const role=$("organizer").value;
   const pin=$("pin").value;
   const title=$("title").value;
   const message=$("message").value;
   if(!/^\d{4}$/.test(pin)){setStatus("Enter a four-digit PIN.","error");return}
   $("publish").disabled=true;
   setStatus("Publishing your update…");
   google.script.run
     .withSuccessHandler(result=>{
       $("publish").disabled=false;
       $("pin").value="";
       if(!result||!result.ok){setStatus("The update could not be confirmed.","error");return}
       $("title").value="";$("message").value="";
       setStatus("Update submitted successfully.","success");
       if(typeof result.url==="string"&&result.url.startsWith("https://github.com/")){
         const link=document.createElement("a");
         link.href=result.url;link.target="_blank";link.rel="noopener noreferrer";
         link.textContent="View update record";
         $("status").appendChild(document.createTextNode(" "));
         $("status").appendChild(link);
       }
     })
     .withFailureHandler(error=>{
       $("publish").disabled=false;
       $("pin").value="";
       setStatus(error&&error.message?error.message:"Unable to publish the update. Please retry.","error");
     })
     .publishUpdate(role,pin,title,message);
 });
})();
</script></body></html>
