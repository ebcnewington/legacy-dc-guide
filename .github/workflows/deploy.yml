name: Publish Legacy DC Guide
on:
  push:
    branches: [main]
  workflow_dispatch:
  issues:
    types: [opened, edited, reopened, closed, deleted]
permissions:
  contents: read
  issues: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: >-
      github.event_name != 'issues' ||
      github.event.issue.user.login == 'wearethebrowns' ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Generate public trip updates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/build_updates.py
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install PDF graphics prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcairo2-dev pkg-config
      - name: Install booklet and image dependencies
        run: python -m pip install -r requirements.txt
      - name: Build Capitol imagery, icons and half-sheet PDF
        run: python scripts/build_editorial.py
      - name: Validate guide and trivia assets
        run: |
          node --check app.js
          node --check api/worker.js
          cp google-apps-script/Code.gs /tmp/ebc-trivia-appscript.js
          node --check /tmp/ebc-trivia-appscript.js
          node api/test-worker.mjs
          python -m json.tool data/guide.json > /dev/null
          python -m json.tool data/updates.json > /dev/null
          python -m json.tool data/publisher-config.json > /dev/null
          python -m py_compile scripts/build_updates.py
          python -m json.tool data/trivia.json > /dev/null
          python -m json.tool data/trivia-extra.json > /dev/null
          python - <<'PYSQL'
          import sqlite3
          from pathlib import Path
          db=sqlite3.connect(":memory:")
          db.executescript(Path("api/schema.sql").read_text())
          db.execute("INSERT INTO ratings(question_id,visitor_hash,stars) VALUES(?,?,?)",("dc-001","test-hash",5))
          assert db.execute("SELECT stars FROM ratings").fetchone()[0]==5
          print("Cloudflare D1-compatible schema smoke test passed")
          PYSQL
          python - <<'PY'
          import json
          from pathlib import Path
          guide=json.loads(Path("data/guide.json").read_text())
          trivia=json.loads(Path("data/trivia.json").read_text())["questions"] + json.loads(Path("data/trivia-extra.json").read_text())["questions"]
          ids={p["id"] for p in guide["places"]}
          assert len(guide["itinerary"]) == 4, "Four trip days required"
          assert len(trivia)>=90, "Question bank unexpectedly small"
          assert len({q["id"] for q in trivia}) == len(trivia), "Duplicate trivia IDs"
          for q in trivia:
              assert q["placeId"] in ids, q["id"]
              assert 0 <= q["correctIndex"] < len(q["options"]), q["id"]
              assert q["source"]["url"].startswith("https://"), q["id"]
          assert Path("guide-half-sheet.pdf").stat().st_size > 15000
          print(f"Validated four trip days and {len(trivia)} sourced questions")
          PY
      - name: Verify print margins, daily notes and home-screen icon
        run: |
          python - <<'PYPDF'
          from pathlib import Path
          from pypdf import PdfReader
          from PIL import Image as PIL
          pdf=PdfReader("guide-half-sheet.pdf")
          page_size=pdf.pages[0].mediabox
          assert abs(float(page_size.width)-396)<.5 and abs(float(page_size.height)-612)<.5
          notes=[i+1 for i,p in enumerate(pdf.pages) if "Notes for " in (p.extract_text() or "")]
          assert notes==[5,7,9], f"Expected right-hand Notes pages 5, 7 and 9, found {notes}"
          word_counts=[len((page.extract_text() or "").split()) for page in pdf.pages]
          assert min(word_counts[:-1])>=16, f"A near-empty PDF page was generated: {[(i+1,w) for i,w in enumerate(word_counts) if w<16]}"
          assert len(pdf.pages)==12 and "Washington Legacy Tour" in pdf.pages[-1].extract_text(), "Expected 12 pages ending with the back cover"
          icon=PIL.open("apple-touch-icon.png")
          assert icon.size==(180,180),icon.size
          assert Path("assets/icon-192.png").stat().st_size > 3000
          assert Path("assets/icon-512.png").stat().st_size > 10000
          named_icon=PIL.open("apple-touch-icon-capitol-2026.png")
          assert named_icon.size==(180,180)
          assert named_icon.getextrema()[0][1]>150, "Apple icon appears unexpectedly blank or dark"
          assert Path("apple-touch-icon-180x180.png").exists()
          import fitz
          inspection=fitz.open("guide-half-sheet.pdf")
          for index,page in enumerate(inspection):
              pix=page.get_pixmap(matrix=fitz.Matrix(1,1),alpha=False)
              rgb=pix.samples
              def pixel(x,y):
                  off=(y*pix.width+x)*pix.n
                  return rgb[off:off+3]
              for x,y in [(0,0),(10,300),(385,300),(200,10),(200,601),(0,306),(395,306)]:
                  assert all(v>=252 for v in pixel(x,y)), f"White border violation on page {index+1} at {x},{y}: {pixel(x,y)}"
          print("Verified uniform 0.25-inch pure-white margin on every page")
          print(f"PDF: {len(pdf.pages)} half-sheet pages with 3 right-hand Notes pages; Apple icon 180x180 verified")
          PYPDF
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
